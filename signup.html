<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F172A">
  <title>ATN Workspace — Create Account</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

  <main class="auth-page">
    <div class="auth-card glass">
      <div class="auth-brand">
        <img src="./assets/icons/atn.svg" alt="ATN Logo" width="48" height="48">
        <span>ATN Workspace</span>
      </div>

      <h1>Create your account</h1>
      <p class="auth-subtitle">Sign up to start organizing your work</p>

      <!-- Sign up form -->
      <form id="signup-form" class="auth-form">
        <label for="auth-name">Full name</label>
        <input type="text" id="auth-name" placeholder="Jane Doe" autocomplete="name" required>

        <label for="auth-email">Work email</label>
        <input type="email" id="auth-email" placeholder="you@company.com" autocomplete="email" required>

        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required>

        <label for="auth-confirm-password">Confirm password</label>
        <input type="password" id="auth-confirm-password" placeholder="••••••••" autocomplete="new-password" minlength="6" required>

        <button type="submit" class="btn btn-primary btn-block" id="signup-submit">
          <span class="btn-label">Create Account</span>
          <span class="spinner hidden" aria-hidden="true"></span>
        </button>
      </form>

      <div class="auth-divider"><span>or continue with</span></div>

      <div class="oauth-grid">
        <button class="oauth-btn" data-provider="google" aria-label="Sign up with Google">
          <i class="fa-brands fa-google"></i>
        </button>
        <button class="oauth-btn" data-provider="github" aria-label="Sign up with GitHub">
          <i class="fa-brands fa-github"></i>
        </button>
        <button class="oauth-btn" data-provider="apple" aria-label="Sign up with Apple">
          <i class="fa-brands fa-apple"></i>
        </button>
        <button class="oauth-btn" data-provider="facebook" aria-label="Sign up with Facebook">
          <i class="fa-brands fa-facebook"></i>
        </button>
      </div>

      <p id="auth-error" class="auth-error" role="alert"></p>

      <p class="auth-switch">Already have an account? <a href="index.html">Sign in</a></p>
    </div>
  </main>

  <div id="toast-root" aria-live="polite"></div>

  <script type="module" src="./components/signup.js"></script>
</body>
</html>
